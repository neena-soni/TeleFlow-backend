# ═══════════════════════════════════════════════════════════════════════
# TeleFlow — Orchestrator Server Configuration
# ═══════════════════════════════════════════════════════════════════════

# ─── Server ─────────────────────────────────────────────────────────────
spring.application.name=orchestrator-server
server.port=8081

# ─── Eureka Client ───────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ─── MVC (keep servlet mode even though webflux is on classpath) ─────────
# This tells Spring Boot to use the MVC web server, not Netty.
# WebFlux is only used for WebClient (non-blocking HTTP), not for the server.
spring.main.web-application-type=servlet

# ─── PostgreSQL ──────────────────────────────────────────────────────────
#spring.datasource.url=jdbc:postgresql://localhost:5432/teleflow_orchestrator
#spring.datasource.username=teleflow
#spring.datasource.password=teleflow123
#spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:postgresql://ep-lingering-heart-b3avfd1j-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_B3NEQoSIH0xJ
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate DDL: 'update' auto-creates/updates tables on startup.
# Change to 'validate' in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── Kafka ───────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092

# Producer: serialize keys as String, values as JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# TeleFlow custom Kafka topic name
teleflow.kafka.topic.lifecycle=teleflow.orders.lifecycle

# ─── Temporal.io ────────────────────────────────────────────────────────
# The gRPC address of the Temporal frontend service.
# Default for local dev / temporal server start-dev: 127.0.0.1:7233
temporal.service.target=127.0.0.1:7233
temporal.namespace=default
temporal.task-queue=teleflow-task-queue

# ─── Downstream Service URLs (WebClient base URLs) ──────────────────────
teleflow.services.inventory.base-url=http://localhost:8082
teleflow.services.network.base-url=http://localhost:8083
teleflow.services.billing.base-url=http://localhost:8084
teleflow.services.notification.base-url=http://localhost:8085

# Timeout in seconds for each downstream HTTP call
teleflow.services.timeout-seconds=5

# ─── WebSocket (STOMP) ───────────────────────────────────────────────────
# Comma-separated origins allowed to connect to the WebSocket endpoint.
# Add your frontend URL here.
teleflow.websocket.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173

# ─── Actuator ────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ─── Jackson ─────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ─── Logging ─────────────────────────────────────────────────────────────
logging.level.com.teleflow=DEBUG
logging.level.io.temporal=INFO
logging.level.org.springframework.web.socket=INFO
