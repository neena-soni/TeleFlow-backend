# ═══════════════════════════════════════════════════════════════════════
# TeleFlow — Billing Service Configuration
# ═══════════════════════════════════════════════════════════════════════

# ─── Server ─────────────────────────────────────────────────────────────
spring.application.name=billing-service
server.port=8084

# ─── Eureka Client ───────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ─── PostgreSQL Database (NeonDB) ────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://ep-lingering-heart-b3avfd1j-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_B3NEQoSIH0xJ
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── Kafka Configuration ─────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ─── Actuator Endpoints ──────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ─── Jackson / JSON ──────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ─── Logging ─────────────────────────────────────────────────────────────
logging.level.com.teleflow=DEBUG
logging.level.org.springframework.web=INFO
