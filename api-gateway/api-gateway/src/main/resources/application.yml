server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:4200"
              - "http://localhost:5173"
            allowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "DELETE"
              - "OPTIONS"
              - "PATCH"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**, /api/auth/**
        - id: orchestrator-orders
          uri: http://localhost:8081
          predicates:
            - Path=/api/orders/**
          filters:
            - JwtAuthenticationFilter
        - id: orchestrator-ws
          uri: ws://localhost:8081
          predicates:
            - Path=/ws-teleflow/**
        - id: orchestrator-actuator
          uri: http://localhost:8081
          predicates:
            - Path=/actuator/**

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true


